<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ClipOrbit Mission Control</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #070b14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        touch-action: none;
      }
      .visualizer-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .canvas-viewport {
        width: 100%;
        height: 100%;
      }
      .studio-badge {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 10px;
        padding: 8px 12px;
        color: #f8fafc;
        pointer-events: none;
      }
      .studio-badge h1 {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #a78bfa;
        margin: 0 0 2px 0;
      }
      .studio-badge p {
        font-size: 9px;
        color: #94a3b8;
        margin: 0;
      }
      .zoom-controls {
        position: absolute;
        top: 14px;
        right: 14px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      .zoom-btn {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #38bdf8;
        font-weight: 700;
        font-size: 14px;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zoom-btn.reset {
        width: auto;
        padding: 0 10px;
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .floating-label {
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(9, 13, 22, 0.88);
        border: 1px solid #38bdf8;
        color: #f1f5f9;
        font-size: 9px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 10px;
        pointer-events: none;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: -42px;
      }
      .floating-label .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .hud-overlay {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 370px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 12px;
        padding: 12px;
        color: #e2e8f0;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .tab-group {
        display: flex;
        gap: 6px;
      }
      .tab-btn {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid transparent;
        color: #94a3b8;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .tab-btn.active {
        color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.1);
      }
      .status-badge {
        font-size: 10px;
        font-weight: 700;
        color: #f87171;
      }
      .status-badge.live {
        color: #4ade80;
      }
      .agent-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
      }
      .agent-card {
        background: rgba(30, 41, 59, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .agent-card.selected {
        border-color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
      }
      .agent-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .agent-state-pill {
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 10px;
        text-transform: uppercase;
        background: rgba(15, 23, 42, 0.8);
      }
      .agent-task-text {
        font-size: 10px;
        color: #cbd5e1;
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .progress-track {
        width: 100%;
        height: 5px;
        background: #0f172a;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        transition: width 0.4s ease;
      }
      .terminal-feed {
        max-height: 180px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 10px;
        line-height: 1.4;
      }
      .log-entry {
        margin: 4px 0;
        word-break: break-word;
      }
      .timestamp { color: #64748b; margin-right: 4px; }
      .agent-tag { font-weight: 700; margin-right: 4px; }

      @media (max-width: 768px) {
        .hud-overlay {
          left: 10px;
          right: 10px;
          bottom: 10px;
          width: auto;
        }
        .agent-list { max-height: 165px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div
        class="visualizer-container"
        @mousedown="onPointerDown"
        @mousemove="onPointerMove"
        @mouseup="onPointerUp"
        @wheel.prevent="onWheel"
        @touchstart.passive="onTouchStart"
        @touchmove.passive="onTouchMove"
        @touchend="onTouchEnd"
      >
        <div ref="canvasContainer" class="canvas-viewport"></div>

        <!-- Floating 3D Labels -->
        <div
          v-for="label in screenLabels"
          :key="label.id"
          class="floating-label"
          :style="{ transform: `translate(${label.x}px, ${label.y}px)`, borderColor: label.color }"
        >
          <span class="dot" :style="{ backgroundColor: label.color }"></span>
          {{ label.text }}
        </div>

        <!-- Top Left Studio Header -->
        <div class="studio-badge">
          <h1>CLIPORBIT // STUDIO</h1>
          <p>Pinch/Scroll to zoom • Tap bot to inspect</p>
        </div>

        <!-- Top Right Zoom Controls -->
        <div class="zoom-controls">
          <button class="zoom-btn" @click="adjustZoom(-3)">+</button>
          <button class="zoom-btn" @click="adjustZoom(3)">−</button>
          <button v-if="focusedAgentId" class="zoom-btn reset" @click="focusedAgentId = null">OVERVIEW</button>
        </div>

        <!-- Bottom HUD: Progress Tracker & Live Logs -->
        <div class="hud-overlay">
          <div class="hud-header">
            <div class="tab-group">
              <button class="tab-btn" :class="{ active: activeTab === 'agents' }" @click="activeTab = 'agents'">
                AGENTS ({{ Object.keys(agents).length }})
              </button>
              <button class="tab-btn" :class="{ active: activeTab === 'logs' }" @click="activeTab = 'logs'">
                LIVE FEED
              </button>
            </div>
            <span class="status-badge" :class="{ live: connected }">
              {{ connected ? '● LIVE' : '○ OFFLINE' }}
            </span>
          </div>

          <!-- Tab 1: Individual Robot Progress & Focus -->
          <div v-if="activeTab === 'agents'" class="agent-list">
            <div
              v-for="ag in agents"
              :key="ag.id"
              class="agent-card"
              :class="{ selected: focusedAgentId === ag.id }"
              @click="toggleFocusAgent(ag.id)"
            >
              <div class="agent-top">
                <span :style="{ color: ag.color }">{{ ag.name }}</span>
                <span class="agent-state-pill" :style="{ color: ag.color }">
                  {{ ag.state }} • {{ ag.progress }}%
                </span>
              </div>
              <div class="agent-task-text">{{ ag.task }} (Done: {{ ag.completed_count }})</div>
              <div class="progress-track">
                <div
                  class="progress-fill"
                  :style="{ width: ag.progress + '%', backgroundColor: ag.color }"
                ></div>
              </div>
            </div>
          </div>

          <!-- Tab 2: Live Stream Terminal -->
          <div v-if="activeTab === 'logs'" class="terminal-feed">
            <p v-for="log in logs" :key="log.id" class="log-entry">
              <span class="timestamp">[{{ log.time }}]</span>
              <span class="agent-tag" :style="{ color: log.color }">{{ log.name }}:</span>
              {{ log.message }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const { createApp, ref, onMounted, onUnmounted } = Vue;

      createApp({
        setup() {
          const canvasContainer = ref(null);
          const connected = ref(false);
          const logs = ref([]);
          const agents = ref({});
          const screenLabels = ref([]);
          const activeTab = ref('agents');
          const focusedAgentId = ref(null);

          let scene, camera, renderer, animationFrameId;
          const stationMeshes = {};
          const stationMeta = {};
          const agentMeshes = {};
          const agentParts = {};
          const agentTargets = {};
          const agentStates = {};

          // Camera Orbit & Zoom State
          let isDragging = false;
          let prevX = 0;
          let initialPinchDist = null;
          let cameraAngle = 0.6;
          let cameraRadius = 21;
          const lookAtTarget = new THREE.Vector3(0, 0, 0);

          const clampRadius = (r) => Math.max(5.5, Math.min(36, r));

          const adjustZoom = (delta) => {
            cameraRadius = clampRadius(cameraRadius + delta);
          };

          const onWheel = (e) => {
            cameraRadius = clampRadius(cameraRadius + e.deltaY * 0.015);
          };

          const onPointerDown = (e) => {
            isDragging = true;
            prevX = e.clientX;
          };
          const onPointerMove = (e) => {
            if (!isDragging) return;
            cameraAngle -= (e.clientX - prevX) * 0.006;
            prevX = e.clientX;
          };
          const onPointerUp = () => { isDragging = false; };

          const getTouchDist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

          const onTouchStart = (e) => {
            if (e.touches.length === 1) {
              isDragging = true;
              prevX = e.touches[0].clientX;
              initialPinchDist = null;
            } else if (e.touches.length === 2) {
              isDragging = false;
              initialPinchDist = getTouchDist(e.touches[0], e.touches[1]);
            }
          };

          const onTouchMove = (e) => {
            if (e.touches.length === 1 && isDragging) {
              cameraAngle -= (e.touches[0].clientX - prevX) * 0.008;
              prevX = e.touches[0].clientX;
            } else if (e.touches.length === 2 && initialPinchDist) {
              const currentDist = getTouchDist(e.touches[0], e.touches[1]);
              const diff = initialPinchDist - currentDist;
              cameraRadius = clampRadius(cameraRadius + diff * 0.06);
              initialPinchDist = currentDist;
            }
          };

          const onTouchEnd = () => {
            isDragging = false;
            initialPinchDist = null;
          };

          const toggleFocusAgent = (id) => {
            if (focusedAgentId.value === id) {
              focusedAgentId.value = null;
              cameraRadius = 21;
            } else {
              focusedAgentId.value = id;
              cameraRadius = 7.5; // Close-up portrait zoom on the sleek white AI bot
            }
          };

          const handleResize = () => {
            if (!canvasContainer.value || !renderer || !camera) return;
            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
          };

          const initScene = () => {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070b14);
            scene.fog = new THREE.FogExp2(0x070b14, 0.018);

            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            canvasContainer.value.appendChild(renderer.domElement);

            // Studio three-point lighting to make the glossy white shells pop
            scene.add(new THREE.AmbientLight(0xdbeafe, 0.75));

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
            keyLight.position.set(10, 22, 14);
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
            rimLight.position.set(-14, 12, -14);
            scene.add(rimLight);

            scene.add(new THREE.GridHelper(32, 32, 0x1e293b, 0x0f172a));
          };

          const createStation = (key, station) => {
            const group = new THREE.Group();
            const pad = new THREE.Mesh(
              new THREE.CylinderGeometry(1.7, 2.0, 0.35, 24),
              new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.6 })
            );
            pad.position.y = 0.18;
            group.add(pad);

            const rim = new THREE.Mesh(
              new THREE.TorusGeometry(1.72, 0.04, 10, 32),
              new THREE.MeshBasicMaterial({ color: station.color || 0x38bdf8 })
            );
            rim.rotation.x = Math.PI / 2;
            rim.position.y = 0.36;
            group.add(rim);

            // Sleek floating holographic station pedestal
            const pedestal = new THREE.Mesh(
              new THREE.CylinderGeometry(0.18, 0.32, 0.85, 16),
              new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.25, metalness: 0.2 })
            );
            pedestal.position.set(0, 0.78, 0);
            group.add(pedestal);

            const holoScreen = new THREE.Mesh(
              new THREE.BoxGeometry(0.85, 0.5, 0.04),
              new THREE.MeshBasicMaterial({
                color: station.color || 0x38bdf8,
                transparent: true,
                opacity: 0.85
              })
            );
            holoScreen.position.set(0, 1.35, 0);
            holoScreen.rotation.x = -0.25;
            group.add(holoScreen);

            group.position.set(station.x, 0, station.z);
            scene.add(group);
            stationMeshes[key] = group;
            stationMeta[key] = station;
          };

          // Generate a crisp chest badge texture ("HU", "ED", "PU", etc.)
          const createChestBadgeTexture = (initials, accentColor) => {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = accentColor;
            ctx.font = 'bold 54px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(initials, 64, 68);
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
          };

          // Build the sleek white hovering AI assistant robot (matching reference image)
          const getOrCreateAgent = (agentData) => {
            const agentId = agentData.id;
            if (!agentMeshes[agentId]) {
              const root = new THREE.Group();
              const accentColor = agentData.color || '#38bdf8';

              // Glossy Ceramic White Material
              const whiteShellMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.18,
                metalness: 0.12
              });

              // Dark Glossy Visor & Ear Trim
              const darkVisorMat = new THREE.MeshStandardMaterial({
                color: 0x090d16,
                roughness: 0.12,
                metalness: 0.7
              });

              const metallicTrimMat = new THREE.MeshStandardMaterial({
                color: 0x94a3b8,
                roughness: 0.3,
                metalness: 0.8
              });

              const eyeGlowMat = new THREE.MeshBasicMaterial({ color: accentColor });

              // Container for the floating body (bobs up and down smoothly)
              const bodyFloatGroup = new THREE.Group();
              root.add(bodyFloatGroup);

              // 1. Concentric Hover Energy Rings underneath
              const innerRing = new THREE.Mesh(
                new THREE.RingGeometry(0.18, 0.28, 28),
                new THREE.MeshBasicMaterial({ color: accentColor, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
              );
              innerRing.rotation.x = Math.PI / 2;
              innerRing.position.y = 0.08;
              root.add(innerRing);

              const outerRing = new THREE.Mesh(
                new THREE.RingGeometry(0.38, 0.45, 32),
                new THREE.MeshBasicMaterial({ color: accentColor, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
              );
              outerRing.rotation.x = Math.PI / 2;
              outerRing.position.y = 0.06;
              root.add(outerRing);

              // 2. Tapered Egg/Teardrop Hovering Torso
              const torsoGeo = new THREE.SphereGeometry(0.36, 24, 24);
              torsoGeo.scale(1.0, 1.25, 0.88);
              const torso = new THREE.Mesh(torsoGeo, whiteShellMat);
              torso.position.y = 0.68;
              bodyFloatGroup.add(torso);

              // Chest Badge Plate (shows agent initials like "ED", "HU", "PU")
              const initials = (agentData.name || 'AI').slice(0, 2).toUpperCase();
              const badgePlate = new THREE.Mesh(
                new THREE.PlaneGeometry(0.28, 0.28),
                new THREE.MeshBasicMaterial({ map: createChestBadgeTexture(initials, accentColor) })
              );
              badgePlate.position.set(0, 0.74, 0.32);
              bodyFloatGroup.add(badgePlate);

              // Neck Collar Ring
              const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.12, 16), darkVisorMat);
              neck.position.y = 1.08;
              bodyFloatGroup.add(neck);

              // 3. Large Rounded AI Helmet Head
              const headGroup = new THREE.Group();
              headGroup.position.y = 1.44;
              bodyFloatGroup.add(headGroup);

              const headShellGeo = new THREE.SphereGeometry(0.46, 28, 28);
              headShellGeo.scale(1.18, 0.92, 0.96);
              const headShell = new THREE.Mesh(headShellGeo, whiteShellMat);
              headGroup.add(headShell);

              // Dark Rounded Face Screen (Protruding slightly forward)
              const faceScreenGeo = new THREE.SphereGeometry(0.39, 24, 24);
              faceScreenGeo.scale(1.14, 0.82, 0.65);
              const faceScreen = new THREE.Mesh(faceScreenGeo, darkVisorMat);
              faceScreen.position.set(0, -0.01, 0.22);
              headGroup.add(faceScreen);

              // Glowing Circular Eyes + Subtle Outer Halo
              const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.068, 16, 16), eyeGlowMat);
              leftEye.scale.set(1, 1.15, 0.5);
              leftEye.position.set(-0.15, 0.01, 0.46);

              const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.068, 16, 16), eyeGlowMat);
              rightEye.scale.set(1, 1.15, 0.5);
              rightEye.position.set(0.15, 0.01, 0.46);
              headGroup.add(leftEye, rightEye);

              // Rounded Side Ear Caps (Headphone look from reference)
              const earGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 16);
              earGeo.rotateZ(Math.PI / 2);
              const leftEar = new THREE.Mesh(earGeo, darkVisorMat);
              leftEar.position.set(-0.54, 0, 0);
              const rightEar = new THREE.Mesh(earGeo, darkVisorMat);
              rightEar.position.set(0.54, 0, 0);
              headGroup.add(leftEar, rightEar);

              // Top Antenna Stem + Glowing Ball Tip
              const antennaStem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.025, 0.18, 10), metallicTrimMat);
              antennaStem.position.set(0, 0.48, 0);
              const antennaTip = new THREE.Mesh(new THREE.SphereGeometry(0.055, 14, 14), eyeGlowMat);
              antennaTip.position.set(0, 0.59, 0);
              headGroup.add(antennaStem, antennaTip);

              // 4. Curved Stubby Floating Arms (Tucked cleanly at sides)
              const leftArmPivot = new THREE.Group();
              leftArmPivot.position.set(-0.42, 0.88, 0);
              const leftArmGeo = new THREE.SphereGeometry(0.11, 16, 16);
              leftArmGeo.scale(0.85, 2.1, 0.9);
              const leftArmMesh = new THREE.Mesh(leftArmGeo, whiteShellMat);
              leftArmMesh.position.set(0, -0.14, 0);
              leftArmMesh.rotation.z = 0.18;
              leftArmPivot.add(leftArmMesh);
              bodyFloatGroup.add(leftArmPivot);

              const rightArmPivot = new THREE.Group();
              rightArmPivot.position.set(0.42, 0.88, 0);
              const rightArmGeo = new THREE.SphereGeometry(0.11, 16, 16);
              rightArmGeo.scale(0.85, 2.1, 0.9);
              const rightArmMesh = new THREE.Mesh(rightArmGeo, whiteShellMat);
              rightArmMesh.position.set(0, -0.14, 0);
              rightArmMesh.rotation.z = -0.18;
              rightArmPivot.add(rightArmMesh);
              bodyFloatGroup.add(rightArmPivot);

              // 5. Orbiting Holographic UI Widgets (Appear when actively working!)
              const holoOrbitGroup = new THREE.Group();
              holoOrbitGroup.position.y = 1.15;
              holoOrbitGroup.visible = false;
              const cardMat = new THREE.MeshBasicMaterial({
                color: accentColor,
                transparent: true,
                opacity: 0.55,
                side: THREE.DoubleSide
              });
              for (let i = 0; i < 3; i++) {
                const angle = (i * Math.PI * 2) / 3;
                const card = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.24), cardMat);
                card.position.set(Math.cos(angle) * 0.88, (i - 1) * 0.15, Math.sin(angle) * 0.88);
                card.lookAt(0, 0, 0);
                holoOrbitGroup.add(card);
              }
              bodyFloatGroup.add(holoOrbitGroup);

              scene.add(root);
              agentMeshes[agentId] = root;
              agentParts[agentId] = {
                body: bodyFloatGroup,
                head: headGroup,
                leftArm: leftArmPivot,
                rightArm: rightArmPivot,
                antennaTip,
                outerRing,
                holoOrbit: holoOrbitGroup
              };
              agentTargets[agentId] = new THREE.Vector3(0, 0, 0);
              agentStates[agentId] = 'idle';
            }
            return agentMeshes[agentId];
          };

          const updateLabels = () => {
            if (!canvasContainer.value) return;
            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;
            const labels = [];

            for (const [key, mesh] of Object.entries(stationMeshes)) {
              const pos = mesh.position.clone();
              pos.y += 2.0;
              pos.project(camera);
              if (pos.z < 1) {
                labels.push({
                  id: `st_${key}`,
                  text: stationMeta[key].name,
                  color: stationMeta[key].color,
                  x: (pos.x * 0.5 + 0.5) * width,
                  y: (-(pos.y * 0.5) + 0.5) * height
                });
              }
            }

            for (const [id, mesh] of Object.entries(agentMeshes)) {
              const ag = agents.value[id];
              if (!ag) continue;
              const pos = mesh.position.clone();
              pos.y += 2.3;
              pos.project(camera);
              if (pos.z < 1) {
                labels.push({
                  id: `ag_${id}`,
                  text: ag.state === 'working' ? `${ag.name} (${ag.progress}%)` : ag.name,
                  color: ag.color,
                  x: (pos.x * 0.5 + 0.5) * width,
                  y: (-(pos.y * 0.5) + 0.5) * height
                });
              }
            }
            screenLabels.value = labels;
          };

          const animate = () => {
            animationFrameId = requestAnimationFrame(animate);
            const now = Date.now();

            const desiredLookAt = new THREE.Vector3(0, 0.8, 0);
            if (focusedAgentId.value && agentMeshes[focusedAgentId.value]) {
              const botPos = agentMeshes[focusedAgentId.value].position;
              desiredLookAt.set(botPos.x, 1.15, botPos.z);
            }
            lookAtTarget.lerp(desiredLookAt, 0.08);

            const camHeight = cameraRadius * 0.62;
            camera.position.x = lookAtTarget.x + Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = lookAtTarget.z + Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = camHeight;
            camera.lookAt(lookAtTarget);

            for (const id in agentMeshes) {
              const robot = agentMeshes[id];
              const parts = agentParts[id];
              const target = agentTargets[id];
              const state = agentStates[id];

              const dx = target.x - robot.position.x;
              const dz = target.z - robot.position.z;
              const dist = Math.hypot(dx, dz);

              robot.position.x += dx * 0.055;
              robot.position.z += dz * 0.055;

              // Smoothly face movement direction
              if (dist > 0.15) {
                robot.rotation.y = Math.atan2(dx, dz);
                parts.body.rotation.x = 0.16; // Lean forward while gliding
              } else {
                parts.body.rotation.x = 0;
              }

              // Pulse outer hover energy ring
              parts.outerRing.scale.setScalar(1 + Math.sin(now * 0.006) * 0.08);

              if (state === 'working' && dist <= 0.6) {
                // Active AI Processing Mode: Orbiting holographic cards + excited gestures
                parts.holoOrbit.visible = true;
                parts.holoOrbit.rotation.y = now * 0.003;
                parts.body.position.y = Math.sin(now * 0.01) * 0.07;
                parts.leftArm.rotation.x = -0.8 + Math.sin(now * 0.02) * 0.35;
                parts.rightArm.rotation.x = -0.8 + Math.cos(now * 0.02) * 0.35;
                parts.head.rotation.y = Math.sin(now * 0.008) * 0.22;
                parts.antennaTip.scale.setScalar(1 + Math.sin(now * 0.025) * 0.35);
              } else if (dist > 0.15) {
                // Gliding to station
                parts.holoOrbit.visible = false;
                parts.body.position.y = Math.sin(now * 0.012) * 0.06;
                parts.leftArm.rotation.x = 0.25;
                parts.rightArm.rotation.x = 0.25;
                parts.head.rotation.y = 0;
                parts.antennaTip.scale.setScalar(1);
              } else {
                // Gentle Hovering Idle
                parts.holoOrbit.visible = false;
                parts.body.position.y = Math.sin(now * 0.0035) * 0.06;
                parts.leftArm.rotation.x = Math.sin(now * 0.0035) * 0.08;
                parts.rightArm.rotation.x = Math.sin(now * 0.0035) * 0.08;
                parts.head.rotation.y = Math.sin(now * 0.0018) * 0.14;
                parts.antennaTip.scale.setScalar(1);
              }
            }

            updateLabels();
            renderer.render(scene, camera);
          };

          let ws;
          const connectWebSocket = () => {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => { connected.value = true; };

            ws.onmessage = (event) => {
              let data;
              try { data = JSON.parse(event.data); } catch { return; }

              if (data.type === 'INITIAL_STATE') {
                for (const [key, station] of Object.entries(data.stations)) {
                  if (!stationMeshes[key]) createStation(key, station);
                }
                agents.value = data.agents;
                for (const ag of Object.values(data.agents)) {
                  getOrCreateAgent(ag);
                }
                return;
              }

              if (data.agent) {
                const ag = data.agent;
                agents.value[ag.id] = { ...ag };
                getOrCreateAgent(ag);
                agentStates[ag.id] = ag.state;

                if (data.target) {
                  agentTargets[ag.id].set(data.target.x, 0, data.target.z + 1.15);
                }

                logs.value.unshift({
                  id: data.event_id,
                  name: ag.name,
                  color: ag.color || '#38bdf8',
                  message: data.message,
                  time: new Date().toLocaleTimeString().split(' ')[0]
                });
                if (logs.value.length > 30) logs.value.pop();
              }
            };

            ws.onclose = () => {
              connected.value = false;
              setTimeout(connectWebSocket, 3000);
            };
          };

          onMounted(() => {
            initScene();
            animate();
            connectWebSocket();
            window.addEventListener('resize', handleResize);
          });

          onUnmounted(() => {
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('resize', handleResize);
            if (ws) ws.close();
          });

          return {
            canvasContainer, connected, logs, agents, screenLabels,
            activeTab, focusedAgentId, adjustZoom, toggleFocusAgent,
            onPointerDown, onPointerMove, onPointerUp, onWheel,
            onTouchStart, onTouchMove, onTouchEnd
          };
        }
      }).mount('#app');
    </script>
  </body>
</html>
