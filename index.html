<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ClipOrbit Mission Control</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #060a12;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        touch-action: none;
      }
      .visualizer-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .canvas-viewport {
        width: 100%;
        height: 100%;
      }
      .studio-badge {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 10px;
        padding: 8px 12px;
        color: #f8fafc;
        pointer-events: none;
      }
      .studio-badge h1 {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #a78bfa;
        margin: 0 0 2px 0;
      }
      .studio-badge p {
        font-size: 9px;
        color: #94a3b8;
        margin: 0;
      }
      .zoom-controls {
        position: absolute;
        top: 14px;
        right: 14px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      .zoom-btn {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #38bdf8;
        font-weight: 700;
        font-size: 14px;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zoom-btn.reset {
        width: auto;
        padding: 0 10px;
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .floating-label {
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(9, 13, 22, 0.88);
        border: 1px solid #38bdf8;
        color: #f1f5f9;
        font-size: 9px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 10px;
        pointer-events: none;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: -42px;
      }
      .floating-label .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .hud-overlay {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 370px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 12px;
        padding: 12px;
        color: #e2e8f0;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .tab-group {
        display: flex;
        gap: 6px;
      }
      .tab-btn {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid transparent;
        color: #94a3b8;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .tab-btn.active {
        color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.1);
      }
      .status-badge {
        font-size: 10px;
        font-weight: 700;
        color: #f87171;
      }
      .status-badge.live {
        color: #4ade80;
      }
      .agent-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
      }
      .agent-card {
        background: rgba(30, 41, 59, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .agent-card.selected {
        border-color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
      }
      .agent-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .agent-state-pill {
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 10px;
        text-transform: uppercase;
        background: rgba(15, 23, 42, 0.8);
      }
      .agent-task-text {
        font-size: 10px;
        color: #cbd5e1;
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .progress-track {
        width: 100%;
        height: 5px;
        background: #0f172a;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        transition: width 0.4s ease;
      }
      .terminal-feed {
        max-height: 180px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 10px;
        line-height: 1.4;
      }
      .log-entry {
        margin: 4px 0;
        word-break: break-word;
      }
      .timestamp { color: #64748b; margin-right: 4px; }
      .agent-tag { font-weight: 700; margin-right: 4px; }

      @media (max-width: 768px) {
        .hud-overlay {
          left: 10px;
          right: 10px;
          bottom: 10px;
          width: auto;
        }
        .agent-list { max-height: 165px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div
        class="visualizer-container"
        @mousedown="onPointerDown"
        @mousemove="onPointerMove"
        @mouseup="onPointerUp"
        @wheel.prevent="onWheel"
        @touchstart.passive="onTouchStart"
        @touchmove.passive="onTouchMove"
        @touchend="onTouchEnd"
      >
        <div ref="canvasContainer" class="canvas-viewport"></div>

        <!-- Floating 3D Labels -->
        <div
          v-for="label in screenLabels"
          :key="label.id"
          class="floating-label"
          :style="{ transform: `translate(${label.x}px, ${label.y}px)`, borderColor: label.color }"
        >
          <span class="dot" :style="{ backgroundColor: label.color }"></span>
          {{ label.text }}
        </div>

        <!-- Top Left Studio Header -->
        <div class="studio-badge">
          <h1>CLIPORBIT // AI LABS</h1>
          <p>Pinch/Scroll to zoom • Tap bot to inspect</p>
        </div>

        <!-- Top Right Zoom Controls -->
        <div class="zoom-controls">
          <button class="zoom-btn" @click="adjustZoom(-3)">+</button>
          <button class="zoom-btn" @click="adjustZoom(3)">−</button>
          <button v-if="focusedAgentId" class="zoom-btn reset" @click="focusedAgentId = null">OVERVIEW</button>
        </div>

        <!-- Bottom HUD: Progress Tracker & Live Logs -->
        <div class="hud-overlay">
          <div class="hud-header">
            <div class="tab-group">
              <button class="tab-btn" :class="{ active: activeTab === 'agents' }" @click="activeTab = 'agents'">
                AGENTS ({{ Object.keys(agents).length }})
              </button>
              <button class="tab-btn" :class="{ active: activeTab === 'logs' }" @click="activeTab = 'logs'">
                LIVE FEED
              </button>
            </div>
            <span class="status-badge" :class="{ live: connected }">
              {{ connected ? '● LIVE' : '○ OFFLINE' }}
            </span>
          </div>

          <!-- Tab 1: Individual Robot Progress & Focus -->
          <div v-if="activeTab === 'agents'" class="agent-list">
            <div
              v-for="ag in agents"
              :key="ag.id"
              class="agent-card"
              :class="{ selected: focusedAgentId === ag.id }"
              @click="toggleFocusAgent(ag.id)"
            >
              <div class="agent-top">
                <span :style="{ color: ag.color }">{{ ag.name }}</span>
                <span class="agent-state-pill" :style="{ color: ag.color }">
                  {{ ag.state }} • {{ ag.progress }}%
                </span>
              </div>
              <div class="agent-task-text">{{ ag.task }} (Done: {{ ag.completed_count }})</div>
              <div class="progress-track">
                <div
                  class="progress-fill"
                  :style="{ width: ag.progress + '%', backgroundColor: ag.color }"
                ></div>
              </div>
            </div>
          </div>

          <!-- Tab 2: Live Stream Terminal -->
          <div v-if="activeTab === 'logs'" class="terminal-feed">
            <p v-for="log in logs" :key="log.id" class="log-entry">
              <span class="timestamp">[{{ log.time }}]</span>
              <span class="agent-tag" :style="{ color: log.color }">{{ log.name }}:</span>
              {{ log.message }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const { createApp, ref, onMounted, onUnmounted } = Vue;

      createApp({
        setup() {
          const canvasContainer = ref(null);
          const connected = ref(false);
          const logs = ref([]);
          const agents = ref({});
          const screenLabels = ref([]);
          const activeTab = ref('agents');
          const focusedAgentId = ref(null);

          let scene, camera, renderer, animationFrameId, particleField;
          const stationMeshes = {};
          const stationAnimParts = {};
          const stationMeta = {};
          const agentMeshes = {};
          const agentParts = {};
          const agentTargets = {};
          const agentStates = {};

          // Camera Orbit & Zoom State
          let isDragging = false;
          let prevX = 0;
          let initialPinchDist = null;
          let cameraAngle = 0.6;
          let cameraRadius = 21;
          const lookAtTarget = new THREE.Vector3(0, 0, 0);

          const clampRadius = (r) => Math.max(5.5, Math.min(36, r));

          const adjustZoom = (delta) => {
            cameraRadius = clampRadius(cameraRadius + delta);
          };

          const onWheel = (e) => {
            cameraRadius = clampRadius(cameraRadius + e.deltaY * 0.015);
          };

          const onPointerDown = (e) => {
            isDragging = true;
            prevX = e.clientX;
          };
          const onPointerMove = (e) => {
            if (!isDragging) return;
            cameraAngle -= (e.clientX - prevX) * 0.006;
            prevX = e.clientX;
          };
          const onPointerUp = () => { isDragging = false; };

          const getTouchDist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

          const onTouchStart = (e) => {
            if (e.touches.length === 1) {
              isDragging = true;
              prevX = e.touches[0].clientX;
              initialPinchDist = null;
            } else if (e.touches.length === 2) {
              isDragging = false;
              initialPinchDist = getTouchDist(e.touches[0], e.touches[1]);
            }
          };

          const onTouchMove = (e) => {
            if (e.touches.length === 1 && isDragging) {
              cameraAngle -= (e.touches[0].clientX - prevX) * 0.008;
              prevX = e.touches[0].clientX;
            } else if (e.touches.length === 2 && initialPinchDist) {
              const currentDist = getTouchDist(e.touches[0], e.touches[1]);
              const diff = initialPinchDist - currentDist;
              cameraRadius = clampRadius(cameraRadius + diff * 0.06);
              initialPinchDist = currentDist;
            }
          };

          const onTouchEnd = () => {
            isDragging = false;
            initialPinchDist = null;
          };

          const toggleFocusAgent = (id) => {
            if (focusedAgentId.value === id) {
              focusedAgentId.value = null;
              cameraRadius = 21;
            } else {
              focusedAgentId.value = id;
              cameraRadius = 7.5;
            }
          };

          const handleResize = () => {
            if (!canvasContainer.value || !renderer || !camera) return;
            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
          };

          const initScene = () => {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060a12);
            scene.fog = new THREE.FogExp2(0x060a12, 0.016);

            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            canvasContainer.value.appendChild(renderer.domElement);

            // Clean-Tech Studio Three-Point Lighting
            scene.add(new THREE.AmbientLight(0xdbeafe, 0.8));

            const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
            keyLight.position.set(12, 24, 14);
            scene.add(keyLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.65);
            rimLight.position.set(-14, 14, -14);
            scene.add(rimLight);

            // Architectural Circular Lab Floor Deck
            const deckFloor = new THREE.Mesh(
              new THREE.CylinderGeometry(16.5, 17.2, 0.25, 48),
              new THREE.MeshStandardMaterial({ color: 0x0b1120, roughness: 0.28, metalness: 0.65 })
            );
            deckFloor.position.y = -0.13;
            scene.add(deckFloor);

            // Outer Glowing Perimeter Ring
            const outerPerimeter = new THREE.Mesh(
              new THREE.RingGeometry(16.3, 16.5, 64),
              new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide })
            );
            outerPerimeter.rotation.x = Math.PI / 2;
            outerPerimeter.position.y = 0.01;
            scene.add(outerPerimeter);

            // Inner Orbital Ring
            const innerOrbit = new THREE.Mesh(
              new THREE.RingGeometry(9.4, 9.52, 64),
              new THREE.MeshBasicMaterial({ color: 0x1e293b, side: THREE.DoubleSide })
            );
            innerOrbit.rotation.x = Math.PI / 2;
            innerOrbit.position.y = 0.01;
            scene.add(innerOrbit);

            // Subtle High-Tech Floor Grid
            const grid = new THREE.GridHelper(30, 30, 0x1e293b, 0x0f172a);
            grid.position.y = 0.005;
            scene.add(grid);

            // Floating Ambient Data Particles
            const particleCount = 90;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            for (let i = 0; i < particleCount * 3; i += 3) {
              positions[i] = (Math.random() - 0.5) * 28;
              positions[i + 1] = 0.5 + Math.random() * 7;
              positions[i + 2] = (Math.random() - 0.5) * 28;
            }
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleField = new THREE.Points(
              particleGeo,
              new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.09, transparent: true, opacity: 0.5 })
            );
            scene.add(particleField);
          };

          // Build glowing energy conduit pathway from Center Hub (0,0) to each Lab
          const createFloorConduit = (targetX, targetZ, color) => {
            const dist = Math.hypot(targetX, targetZ);
            if (dist < 0.5) return;
            const conduit = new THREE.Mesh(
              new THREE.PlaneGeometry(0.14, dist),
              new THREE.MeshBasicMaterial({
                color: color || 0x38bdf8,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.45
              })
            );
            conduit.rotation.x = Math.PI / 2;
            conduit.rotation.z = -Math.atan2(targetX, targetZ);
            conduit.position.set(targetX / 2, 0.015, targetZ / 2);
            scene.add(conduit);
          };

          // Build custom futuristic AI Laboratory pods for each station
          const createStation = (key, station) => {
            const group = new THREE.Group();
            const accent = station.color || '#38bdf8';

            const ceramicWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.22, metalness: 0.2 });
            const darkSlateMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.35, metalness: 0.7 });
            const holoGlassMat = new THREE.MeshBasicMaterial({
              color: accent,
              transparent: true,
              opacity: 0.35,
              side: THREE.DoubleSide
            });
            const neonMat = new THREE.MeshBasicMaterial({ color: accent });

            // 1. Sleek Circular Base Platform + Glowing Ring
            const basePad = new THREE.Mesh(new THREE.CylinderGeometry(1.85, 2.1, 0.24, 32), darkSlateMat);
            basePad.position.y = 0.12;
            group.add(basePad);

            const whiteTrim = new THREE.Mesh(new THREE.TorusGeometry(1.86, 0.05, 12, 36), ceramicWhiteMat);
            whiteTrim.rotation.x = Math.PI / 2;
            whiteTrim.position.y = 0.24;
            group.add(whiteTrim);

            const neonRing = new THREE.Mesh(new THREE.TorusGeometry(1.94, 0.025, 10, 36), neonMat);
            neonRing.rotation.x = Math.PI / 2;
            neonRing.position.y = 0.2;
            group.add(neonRing);

            // Connect station to Director Hub with a floor conduit
            createFloorConduit(station.x, station.z, accent);

            // 2. Station-Specific Lab Equipment
            const animRig = new THREE.Group();
            group.add(animRig);

            if (key === 'hub') {
              // Central Director Core: Floating crystal core + dual rotating orbital rings
              const core = new THREE.Mesh(new THREE.OctahedronGeometry(0.42, 0), neonMat);
              core.position.y = 1.45;
              animRig.add(core);

              const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.025, 10, 32), ceramicWhiteMat);
              ring1.position.y = 1.45;
              ring1.rotation.x = 0.6;
              animRig.add(ring1);

              const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.02, 10, 32), neonMat);
              ring2.position.y = 1.45;
              ring2.rotation.y = 0.8;
              animRig.add(ring2);

              stationAnimParts[key] = { type: 'hub', core, ring1, ring2 };
            } else if (key === 'hunter') {
              // Hunter & Scout Bay: Ceramic pedestal + Radar Dish + Scanning Wave
              const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.36, 0.9, 16), ceramicWhiteMat);
              pillar.position.y = 0.68;
              group.add(pillar);

              const dishGroup = new THREE.Group();
              dishGroup.position.set(0, 1.35, -0.2);
              const dish = new THREE.Mesh(
                new THREE.SphereGeometry(0.65, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.4),
                ceramicWhiteMat
              );
              dish.rotation.x = Math.PI * 0.72;
              const dishTip = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.45, 8), neonMat);
              dishTip.position.set(0, 0.15, 0.25);
              dishTip.rotation.x = 0.7;
              dishGroup.add(dish, dishTip);
              animRig.add(dishGroup);

              stationAnimParts[key] = { type: 'hunter', dishGroup };
            } else if (key === 'editor') {
              // Editor Render Studio: Curved 9:16 Vertical Multi-Screen Array
              const desk = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.65, 0.45), ceramicWhiteMat);
              desk.position.set(0, 0.55, -0.35);
              group.add(desk);

              // Three 9:16 vertical holographic screens (center + angled wings)
              const centerScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.95), holoGlassMat);
              centerScreen.position.set(0, 1.45, -0.35);
              const centerBorder = new THREE.LineSegments(
                new THREE.EdgesGeometry(new THREE.PlaneGeometry(0.55, 0.95)),
                new THREE.LineBasicMaterial({ color: accent })
              );
              centerBorder.position.copy(centerScreen.position);

              const leftScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.8), holoGlassMat);
              leftScreen.position.set(-0.62, 1.4, -0.22);
              leftScreen.rotation.y = 0.42;

              const rightScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.8), holoGlassMat);
              rightScreen.position.set(0.62, 1.4, -0.22);
              rightScreen.rotation.y = -0.42;

              group.add(centerScreen, centerBorder, leftScreen, rightScreen);
              stationAnimParts[key] = { type: 'editor', centerScreen };
            } else if (key === 'analyst') {
              // Analyst & QA Lab: Holographic 3D Bar Chart Console
              const table = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.55, 0.65, 20), ceramicWhiteMat);
              table.position.set(0, 0.55, -0.25);
              group.add(table);

              const barsGroup = new THREE.Group();
              barsGroup.position.set(0, 1.0, -0.25);
              const heights = [0.35, 0.65, 0.48, 0.85];
              heights.forEach((h, idx) => {
                const bar = new THREE.Mesh(new THREE.BoxGeometry(0.14, h, 0.14), neonMat);
                bar.position.set((idx - 1.5) * 0.24, h / 2, 0);
                barsGroup.add(bar);
              });
              animRig.add(barsGroup);
              stationAnimParts[key] = { type: 'analyst', barsGroup };
            } else if (key === 'publisher') {
              // Shorts Broadcast Tower: Tall white spire + pulsing signal rings
              const towerBase = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.5, 0.9, 16), ceramicWhiteMat);
              towerBase.position.set(0, 0.68, -0.25);
              const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.14, 1.15, 12), darkSlateMat);
              spire.position.set(0, 1.65, -0.25);
              const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 14), neonMat);
              beacon.position.set(0, 2.28, -0.25);
              group.add(towerBase, spire, beacon);

              const pulseRing = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.02, 8, 24), neonMat);
              pulseRing.rotation.x = Math.PI / 2;
              pulseRing.position.set(0, 2.1, -0.25);
              animRig.add(pulseRing);

              stationAnimParts[key] = { type: 'publisher', pulseRing, beacon };
            }

            group.position.set(station.x, 0, station.z);
            scene.add(group);
            stationMeshes[key] = group;
            stationMeta[key] = station;
          };

          const createChestBadgeTexture = (initials, accentColor) => {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = accentColor;
            ctx.font = 'bold 54px -apple-system, BlinkMacSystemFont, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(initials, 64, 68);
            return new THREE.CanvasTexture(canvas);
          };

          // Build sleek white hovering AI assistant robot
          const getOrCreateAgent = (agentData) => {
            const agentId = agentData.id;
            if (!agentMeshes[agentId]) {
              const root = new THREE.Group();
              const accentColor = agentData.color || '#38bdf8';

              const whiteShellMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.18,
                metalness: 0.12
              });
              const darkVisorMat = new THREE.MeshStandardMaterial({
                color: 0x090d16,
                roughness: 0.12,
                metalness: 0.7
              });
              const metallicTrimMat = new THREE.MeshStandardMaterial({
                color: 0x94a3b8,
                roughness: 0.3,
                metalness: 0.8
              });
              const eyeGlowMat = new THREE.MeshBasicMaterial({ color: accentColor });

              const bodyFloatGroup = new THREE.Group();
              root.add(bodyFloatGroup);

              const innerRing = new THREE.Mesh(
                new THREE.RingGeometry(0.18, 0.28, 28),
                new THREE.MeshBasicMaterial({ color: accentColor, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
              );
              innerRing.rotation.x = Math.PI / 2;
              innerRing.position.y = 0.08;
              root.add(innerRing);

              const outerRing = new THREE.Mesh(
                new THREE.RingGeometry(0.38, 0.45, 32),
                new THREE.MeshBasicMaterial({ color: accentColor, side: THREE.DoubleSide, transparent: true, opacity: 0.4 })
              );
              outerRing.rotation.x = Math.PI / 2;
              outerRing.position.y = 0.06;
              root.add(outerRing);

              const torsoGeo = new THREE.SphereGeometry(0.36, 24, 24);
              torsoGeo.scale(1.0, 1.25, 0.88);
              const torso = new THREE.Mesh(torsoGeo, whiteShellMat);
              torso.position.y = 0.68;
              bodyFloatGroup.add(torso);

              const initials = (agentData.name || 'AI').slice(0, 2).toUpperCase();
              const badgePlate = new THREE.Mesh(
                new THREE.PlaneGeometry(0.28, 0.28),
                new THREE.MeshBasicMaterial({ map: createChestBadgeTexture(initials, accentColor) })
              );
              badgePlate.position.set(0, 0.74, 0.32);
              bodyFloatGroup.add(badgePlate);

              const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.12, 16), darkVisorMat);
              neck.position.y = 1.08;
              bodyFloatGroup.add(neck);

              const headGroup = new THREE.Group();
              headGroup.position.y = 1.44;
              bodyFloatGroup.add(headGroup);

              const headShellGeo = new THREE.SphereGeometry(0.46, 28, 28);
              headShellGeo.scale(1.18, 0.92, 0.96);
              headGroup.add(new THREE.Mesh(headShellGeo, whiteShellMat));

              const faceScreenGeo = new THREE.SphereGeometry(0.39, 24, 24);
              faceScreenGeo.scale(1.14, 0.82, 0.65);
              const faceScreen = new THREE.Mesh(faceScreenGeo, darkVisorMat);
              faceScreen.position.set(0, -0.01, 0.22);
              headGroup.add(faceScreen);

              const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.068, 16, 16), eyeGlowMat);
              leftEye.scale.set(1, 1.15, 0.5);
              leftEye.position.set(-0.15, 0.01, 0.46);

              const rightEye = new THREE.Mesh(new THREE.SphereGeometry(0.068, 16, 16), eyeGlowMat);
              rightEye.scale.set(1, 1.15, 0.5);
              rightEye.position.set(0.15, 0.01, 0.46);
              headGroup.add(leftEye, rightEye);

              const earGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.08, 16);
              earGeo.rotateZ(Math.PI / 2);
              const leftEar = new THREE.Mesh(earGeo, darkVisorMat);
              leftEar.position.set(-0.54, 0, 0);
              const rightEar = new THREE.Mesh(earGeo, darkVisorMat);
              rightEar.position.set(0.54, 0, 0);
              headGroup.add(leftEar, rightEar);

              const antennaStem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.025, 0.18, 10), metallicTrimMat);
              antennaStem.position.set(0, 0.48, 0);
              const antennaTip = new THREE.Mesh(new THREE.SphereGeometry(0.055, 14, 14), eyeGlowMat);
              antennaTip.position.set(0, 0.59, 0);
              headGroup.add(antennaStem, antennaTip);

              const leftArmPivot = new THREE.Group();
              leftArmPivot.position.set(-0.42, 0.88, 0);
              const leftArmGeo = new THREE.SphereGeometry(0.11, 16, 16);
              leftArmGeo.scale(0.85, 2.1, 0.9);
              const leftArmMesh = new THREE.Mesh(leftArmGeo, whiteShellMat);
              leftArmMesh.position.set(0, -0.14, 0);
              leftArmMesh.rotation.z = 0.18;
              leftArmPivot.add(leftArmMesh);
              bodyFloatGroup.add(leftArmPivot);

              const rightArmPivot = new THREE.Group();
              rightArmPivot.position.set(0.42, 0.88, 0);
              const rightArmGeo = new THREE.SphereGeometry(0.11, 16, 16);
              rightArmGeo.scale(0.85, 2.1, 0.9);
              const rightArmMesh = new THREE.Mesh(rightArmGeo, whiteShellMat);
              rightArmMesh.position.set(0, -0.14, 0);
              rightArmMesh.rotation.z = -0.18;
              rightArmPivot.add(rightArmMesh);
              bodyFloatGroup.add(rightArmPivot);

              const holoOrbitGroup = new THREE.Group();
              holoOrbitGroup.position.y = 1.15;
              holoOrbitGroup.visible = false;
              const cardMat = new THREE.MeshBasicMaterial({
                color: accentColor,
                transparent: true,
                opacity: 0.55,
                side: THREE.DoubleSide
              });
              for (let i = 0; i < 3; i++) {
                const angle = (i * Math.PI * 2) / 3;
                const card = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.24), cardMat);
                card.position.set(Math.cos(angle) * 0.88, (i - 1) * 0.15, Math.sin(angle) * 0.88);
                card.lookAt(0, 0, 0);
                holoOrbitGroup.add(card);
              }
              bodyFloatGroup.add(holoOrbitGroup);

              scene.add(root);
              agentMeshes[agentId] = root;
              agentParts[agentId] = {
                body: bodyFloatGroup,
                head: headGroup,
                leftArm: leftArmPivot,
                rightArm: rightArmPivot,
                antennaTip,
                outerRing,
                holoOrbit: holoOrbitGroup
              };
              agentTargets[agentId] = new THREE.Vector3(0, 0, 0);
              agentStates[agentId] = 'idle';
            }
            return agentMeshes[agentId];
          };

          const updateLabels = () => {
            if (!canvasContainer.value) return;
            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;
            const labels = [];

            for (const [key, mesh] of Object.entries(stationMeshes)) {
              const pos = mesh.position.clone();
              pos.y += 2.35;
              pos.project(camera);
              if (pos.z < 1) {
                labels.push({
                  id: `st_${key}`,
                  text: stationMeta[key].name,
                  color: stationMeta[key].color,
                  x: (pos.x * 0.5 + 0.5) * width,
                  y: (-(pos.y * 0.5) + 0.5) * height
                });
              }
            }

            for (const [id, mesh] of Object.entries(agentMeshes)) {
              const ag = agents.value[id];
              if (!ag) continue;
              const pos = mesh.position.clone();
              pos.y += 2.3;
              pos.project(camera);
              if (pos.z < 1) {
                labels.push({
                  id: `ag_${id}`,
                  text: ag.state === 'working' ? `${ag.name} (${ag.progress}%)` : ag.name,
                  color: ag.color,
                  x: (pos.x * 0.5 + 0.5) * width,
                  y: (-(pos.y * 0.5) + 0.5) * height
                });
              }
            }
            screenLabels.value = labels;
          };

          const animate = () => {
            animationFrameId = requestAnimationFrame(animate);
            const now = Date.now();

            const desiredLookAt = new THREE.Vector3(0, 0.8, 0);
            if (focusedAgentId.value && agentMeshes[focusedAgentId.value]) {
              const botPos = agentMeshes[focusedAgentId.value].position;
              desiredLookAt.set(botPos.x, 1.15, botPos.z);
            }
            lookAtTarget.lerp(desiredLookAt, 0.08);

            const camHeight = cameraRadius * 0.62;
            camera.position.x = lookAtTarget.x + Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = lookAtTarget.z + Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = camHeight;
            camera.lookAt(lookAtTarget);

            // Subtle ambient particle drift
            if (particleField) {
              particleField.rotation.y = now * 0.00012;
            }

            // Animate Station Lab Equipment
            for (const part of Object.values(stationAnimParts)) {
              if (part.type === 'hub') {
                part.core.rotation.y = now * 0.002;
                part.ring1.rotation.z = now * 0.0015;
                part.ring2.rotation.x = -now * 0.0012;
              } else if (part.type === 'hunter') {
                part.dishGroup.rotation.y = Math.sin(now * 0.0012) * 0.8;
              } else if (part.type === 'analyst') {
                part.barsGroup.rotation.y = now * 0.001;
              } else if (part.type === 'publisher') {
                const cycle = (now * 0.0012) % 1;
                part.pulseRing.scale.setScalar(0.5 + cycle * 1.8);
                part.pulseRing.position.y = 1.6 + cycle * 0.75;
              }
            }

            // Animate Robots
            for (const id in agentMeshes) {
              const robot = agentMeshes[id];
              const parts = agentParts[id];
              const target = agentTargets[id];
              const state = agentStates[id];

              const dx = target.x - robot.position.x;
              const dz = target.z - robot.position.z;
              const dist = Math.hypot(dx, dz);

              robot.position.x += dx * 0.055;
              robot.position.z += dz * 0.055;

              if (dist > 0.15) {
                robot.rotation.y = Math.atan2(dx, dz);
                parts.body.rotation.x = 0.16;
              } else {
                parts.body.rotation.x = 0;
              }

              parts.outerRing.scale.setScalar(1 + Math.sin(now * 0.006) * 0.08);

              if (state === 'working' && dist <= 0.6) {
                parts.holoOrbit.visible = true;
                parts.holoOrbit.rotation.y = now * 0.003;
                parts.body.position.y = Math.sin(now * 0.01) * 0.07;
                parts.leftArm.rotation.x = -0.8 + Math.sin(now * 0.02) * 0.35;
                parts.rightArm.rotation.x = -0.8 + Math.cos(now * 0.02) * 0.35;
                parts.head.rotation.y = Math.sin(now * 0.008) * 0.22;
                parts.antennaTip.scale.setScalar(1 + Math.sin(now * 0.025) * 0.35);
              } else if (dist > 0.15) {
                parts.holoOrbit.visible = false;
                parts.body.position.y = Math.sin(now * 0.012) * 0.06;
                parts.leftArm.rotation.x = 0.25;
                parts.rightArm.rotation.x = 0.25;
                parts.head.rotation.y = 0;
                parts.antennaTip.scale.setScalar(1);
              } else {
                parts.holoOrbit.visible = false;
                parts.body.position.y = Math.sin(now * 0.0035) * 0.06;
                parts.leftArm.rotation.x = Math.sin(now * 0.0035) * 0.08;
                parts.rightArm.rotation.x = Math.sin(now * 0.0035) * 0.08;
                parts.head.rotation.y = Math.sin(now * 0.0018) * 0.14;
                parts.antennaTip.scale.setScalar(1);
              }
            }

            updateLabels();
            renderer.render(scene, camera);
          };

          let ws;
          const connectWebSocket = () => {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => { connected.value = true; };

            ws.onmessage = (event) => {
              let data;
              try { data = JSON.parse(event.data); } catch { return; }

              if (data.type === 'INITIAL_STATE') {
                for (const [key, station] of Object.entries(data.stations)) {
                  if (!stationMeshes[key]) createStation(key, station);
                }
                agents.value = data.agents;
                for (const ag of Object.values(data.agents)) {
                  getOrCreateAgent(ag);
                }
                return;
              }

              if (data.agent) {
                const ag = data.agent;
                agents.value[ag.id] = { ...ag };
                getOrCreateAgent(ag);
                agentStates[ag.id] = ag.state;

                if (data.target) {
                  agentTargets[ag.id].set(data.target.x, 0, data.target.z + 1.15);
                }

                logs.value.unshift({
                  id: data.event_id,
                  name: ag.name,
                  color: ag.color || '#38bdf8',
                  message: data.message,
                  time: new Date().toLocaleTimeString().split(' ')[0]
                });
                if (logs.value.length > 30) logs.value.pop();
              }
            };

            ws.onclose = () => {
              connected.value = false;
              setTimeout(connectWebSocket, 3000);
            };
          };

          onMounted(() => {
            initScene();
            animate();
            connectWebSocket();
            window.addEventListener('resize', handleResize);
          });

          onUnmounted(() => {
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('resize', handleResize);
            if (ws) ws.close();
          });

          return {
            canvasContainer, connected, logs, agents, screenLabels,
            activeTab, focusedAgentId, adjustZoom, toggleFocusAgent,
            onPointerDown, onPointerMove, onPointerUp, onWheel,
            onTouchStart, onTouchMove, onTouchEnd
          };
        }
      }).mount('#app');
    </script>
  </body>
</html>
