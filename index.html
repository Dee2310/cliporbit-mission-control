<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ClipOrbit Mission Control</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #090d16;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        touch-action: none;
      }
      .visualizer-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .canvas-viewport {
        width: 100%;
        height: 100%;
      }
      .studio-badge {
        position: absolute;
        top: 14px;
        left: 14px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(139, 92, 246, 0.35);
        border-radius: 10px;
        padding: 8px 12px;
        color: #f8fafc;
        pointer-events: none;
      }
      .studio-badge h1 {
        font-size: 11px;
        letter-spacing: 0.08em;
        color: #a78bfa;
        margin: 0 0 2px 0;
      }
      .studio-badge p {
        font-size: 9px;
        color: #94a3b8;
        margin: 0;
      }
      /* Zoom & Reset Floating Controls for Easy Thumb Reach */
      .zoom-controls {
        position: absolute;
        top: 14px;
        right: 14px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      .zoom-btn {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: #38bdf8;
        font-weight: 700;
        font-size: 14px;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zoom-btn.reset {
        width: auto;
        padding: 0 10px;
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .floating-label {
        position: absolute;
        top: 0;
        left: 0;
        background: rgba(9, 13, 22, 0.85);
        border: 1px solid #38bdf8;
        color: #f1f5f9;
        font-size: 9px;
        font-weight: 600;
        padding: 2px 6px;
        border-radius: 4px;
        pointer-events: none;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: -40px;
      }
      .floating-label .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      /* Bottom Mobile Dock: Agent Roster + Progress + Logs */
      .hud-overlay {
        position: absolute;
        bottom: 12px;
        right: 12px;
        width: 370px;
        background: rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(56, 189, 248, 0.25);
        border-radius: 12px;
        padding: 12px;
        color: #e2e8f0;
      }
      .hud-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .tab-group {
        display: flex;
        gap: 6px;
      }
      .tab-btn {
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid transparent;
        color: #94a3b8;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .tab-btn.active {
        color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.4);
        background: rgba(56, 189, 248, 0.1);
      }
      .status-badge {
        font-size: 10px;
        font-weight: 700;
        color: #f87171;
      }
      .status-badge.live {
        color: #4ade80;
      }
      /* Agent Progress Cards */
      .agent-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 220px;
        overflow-y: auto;
      }
      .agent-card {
        background: rgba(30, 41, 59, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 8px;
        padding: 8px;
        cursor: pointer;
        transition: border-color 0.2s;
      }
      .agent-card.selected {
        border-color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
      }
      .agent-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .agent-state-pill {
        font-size: 9px;
        padding: 1px 6px;
        border-radius: 10px;
        text-transform: uppercase;
        background: rgba(15, 23, 42, 0.8);
      }
      .agent-task-text {
        font-size: 10px;
        color: #cbd5e1;
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .progress-track {
        width: 100%;
        height: 5px;
        background: #0f172a;
        border-radius: 4px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        transition: width 0.4s ease;
      }
      .terminal-feed {
        max-height: 180px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 10px;
        line-height: 1.4;
      }
      .log-entry {
        margin: 4px 0;
        word-break: break-word;
      }
      .timestamp { color: #64748b; margin-right: 4px; }
      .agent-tag { font-weight: 700; margin-right: 4px; }

      @media (max-width: 768px) {
        .hud-overlay {
          left: 10px;
          right: 10px;
          bottom: 10px;
          width: auto;
        }
        .agent-list { max-height: 165px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div
        class="visualizer-container"
        @mousedown="onPointerDown"
        @mousemove="onPointerMove"
        @mouseup="onPointerUp"
        @wheel.prevent="onWheel"
        @touchstart.passive="onTouchStart"
        @touchmove.passive="onTouchMove"
        @touchend="onTouchEnd"
      >
        <div ref="canvasContainer" class="canvas-viewport"></div>

        <!-- Floating 3D Labels -->
        <div
          v-for="label in screenLabels"
          :key="label.id"
          class="floating-label"
          :style="{ transform: `translate(${label.x}px, ${label.y}px)`, borderColor: label.color }"
        >
          <span class="dot" :style="{ backgroundColor: label.color }"></span>
          {{ label.text }}
        </div>

        <!-- Top Left Studio Header -->
        <div class="studio-badge">
          <h1>CLIPORBIT // STUDIO</h1>
          <p>Pinch/Scroll to zoom • Tap bot to inspect</p>
        </div>

        <!-- Top Right Zoom Controls -->
        <div class="zoom-controls">
          <button class="zoom-btn" @click="adjustZoom(-3)">+</button>
          <button class="zoom-btn" @click="adjustZoom(3)">−</button>
          <button v-if="focusedAgentId" class="zoom-btn reset" @click="focusedAgentId = null">OVERVIEW</button>
        </div>

        <!-- Bottom HUD: Progress Tracker & Live Logs -->
        <div class="hud-overlay">
          <div class="hud-header">
            <div class="tab-group">
              <button class="tab-btn" :class="{ active: activeTab === 'agents' }" @click="activeTab = 'agents'">
                AGENTS ({{ Object.keys(agents).length }})
              </button>
              <button class="tab-btn" :class="{ active: activeTab === 'logs' }" @click="activeTab = 'logs'">
                LIVE FEED
              </button>
            </div>
            <span class="status-badge" :class="{ live: connected }">
              {{ connected ? '● LIVE' : '○ OFFLINE' }}
            </span>
          </div>

          <!-- Tab 1: Individual Robot Progress & Focus -->
          <div v-if="activeTab === 'agents'" class="agent-list">
            <div
              v-for="ag in agents"
              :key="ag.id"
              class="agent-card"
              :class="{ selected: focusedAgentId === ag.id }"
              @click="toggleFocusAgent(ag.id)"
            >
              <div class="agent-top">
                <span :style="{ color: ag.color }">{{ ag.name }}</span>
                <span class="agent-state-pill" :style="{ color: ag.color }">
                  {{ ag.state }} • {{ ag.progress }}%
                </span>
              </div>
              <div class="agent-task-text">{{ ag.task }} (Done: {{ ag.completed_count }})</div>
              <div class="progress-track">
                <div
                  class="progress-fill"
                  :style="{ width: ag.progress + '%', backgroundColor: ag.color }"
                ></div>
              </div>
            </div>
          </div>

          <!-- Tab 2: Live Stream Terminal -->
          <div v-if="activeTab === 'logs'" class="terminal-feed">
            <p v-for="log in logs" :key="log.id" class="log-entry">
              <span class="timestamp">[{{ log.time }}]</span>
              <span class="agent-tag" :style="{ color: log.color }">{{ log.name }}:</span>
              {{ log.message }}
            </p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const { createApp, ref, onMounted, onUnmounted } = Vue;

      createApp({
        setup() {
          const canvasContainer = ref(null);
          const connected = ref(false);
          const logs = ref([]);
          const agents = ref({});
          const screenLabels = ref([]);
          const activeTab = ref('agents');
          const focusedAgentId = ref(null);

          let scene, camera, renderer, animationFrameId;
          const stationMeshes = {};
          const stationMeta = {};
          const agentMeshes = {};
          const agentParts = {};
          const agentTargets = {};
          const agentStates = {};

          // Camera Orbit & Zoom State
          let isDragging = false;
          let prevX = 0;
          let initialPinchDist = null;
          let cameraAngle = 0.6;
          let cameraRadius = 21;
          const lookAtTarget = new THREE.Vector3(0, 0, 0);

          const clampRadius = (r) => Math.max(6, Math.min(36, r));

          const adjustZoom = (delta) => {
            cameraRadius = clampRadius(cameraRadius + delta);
          };

          const onWheel = (e) => {
            cameraRadius = clampRadius(cameraRadius + e.deltaY * 0.015);
          };

          const onPointerDown = (e) => {
            isDragging = true;
            prevX = e.clientX;
          };
          const onPointerMove = (e) => {
            if (!isDragging) return;
            cameraAngle -= (e.clientX - prevX) * 0.006;
            prevX = e.clientX;
          };
          const onPointerUp = () => { isDragging = false; };

          const getTouchDist = (t1, t2) => Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

          const onTouchStart = (e) => {
            if (e.touches.length === 1) {
              isDragging = true;
              prevX = e.touches[0].clientX;
              initialPinchDist = null;
            } else if (e.touches.length === 2) {
              isDragging = false;
              initialPinchDist = getTouchDist(e.touches[0], e.touches[1]);
            }
          };

          const onTouchMove = (e) => {
            if (e.touches.length === 1 && isDragging) {
              cameraAngle -= (e.touches[0].clientX - prevX) * 0.008;
              prevX = e.touches[0].clientX;
            } else if (e.touches.length === 2 && initialPinchDist) {
              const currentDist = getTouchDist(e.touches[0], e.touches[1]);
              const diff = initialPinchDist - currentDist;
              cameraRadius = clampRadius(cameraRadius + diff * 0.06);
              initialPinchDist = currentDist;
            }
          };

          const onTouchEnd = () => {
            isDragging = false;
            initialPinchDist = null;
          };

          const toggleFocusAgent = (id) => {
            if (focusedAgentId.value === id) {
              focusedAgentId.value = null;
              cameraRadius = 21;
            } else {
              focusedAgentId.value = id;
              cameraRadius = 9.5; // Zoom in close to inspect the robot!
            }
          };

          const handleResize = () => {
            if (!canvasContainer.value || !renderer || !camera) return;
            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
          };

          const initScene = () => {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);

            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;

            camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            canvasContainer.value.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(12, 24, 12);
            scene.add(dirLight);

            scene.add(new THREE.GridHelper(32, 32, 0x1e293b, 0x0f172a));
          };

          const createStation = (key, station) => {
            const group = new THREE.Group();
            const pad = new THREE.Mesh(
              new THREE.CylinderGeometry(1.7, 2.0, 0.4, 6),
              new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4, metalness: 0.5 })
            );
            pad.position.y = 0.2;
            group.add(pad);

            const rim = new THREE.Mesh(
              new THREE.CylinderGeometry(1.75, 1.75, 0.08, 6),
              new THREE.MeshBasicMaterial({ color: station.color || 0x38bdf8 })
            );
            rim.position.y = 0.41;
            group.add(rim);

            const consoleBox = new THREE.Mesh(
              new THREE.BoxGeometry(0.7, 0.9, 0.5),
              new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.4, roughness: 0.3 })
            );
            consoleBox.position.set(0, 0.85, 0);
            group.add(consoleBox);

            const screen = new THREE.Mesh(
              new THREE.BoxGeometry(0.55, 0.35, 0.05),
              new THREE.MeshBasicMaterial({ color: station.color || 0x38bdf8 })
            );
            screen.position.set(0, 1.1, 0.26);
            screen.rotation.x = -0.25;
            group.add(screen);

            group.position.set(station.x, 0, station.z);
            scene.add(group);
            stationMeshes[key] = group;
            stationMeta[key] = station;
          };

          const getOrCreateAgent = (agentData) => {
            const agentId = agentData.id;
            if (!agentMeshes[agentId]) {
              const root = new THREE.Group();
              const hexColor = agentData.color || '#38bdf8';

              const armorMat = new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.35, metalness: 0.3 });
              const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5, metalness: 0.6 });
              const glowMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

              // Base & Thruster Ring
              const base = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 0.22, 12), darkMetalMat);
              base.position.y = 0.16;
              root.add(base);

              const ring = new THREE.Mesh(
                new THREE.RingGeometry(0.36, 0.48, 20),
                new THREE.MeshBasicMaterial({ color: hexColor, side: THREE.DoubleSide })
              );
              ring.rotation.x = Math.PI / 2;
              ring.position.y = 0.04;
              root.add(ring);

              // Torso
              const torso = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.55, 0.4), armorMat);
              torso.position.y = 0.58;
              root.add(torso);

              // Head + Visor + Eyes + Antenna
              const headGroup = new THREE.Group();
              headGroup.position.y = 1.05;
              headGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.36, 0.38), armorMat));

              const visor = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.16, 0.05), darkMetalMat);
              visor.position.set(0, 0.02, 0.19);
              headGroup.add(visor);

              const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.02), glowMat);
              leftEye.position.set(-0.09, 0.02, 0.22);
              const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.02), glowMat);
              rightEye.position.set(0.09, 0.02, 0.22);
              headGroup.add(leftEye, rightEye);

              const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 6), darkMetalMat);
              stalk.position.set(0, 0.28, 0);
              const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: hexColor }));
              beacon.position.set(0, 0.4, 0);
              headGroup.add(stalk, beacon);
              root.add(headGroup);

              // Articulated Arms
              const leftArmPivot = new THREE.Group();
              leftArmPivot.position.set(-0.35, 0.78, 0);
              const leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.42, 0.14), darkMetalMat);
              leftArm.position.y = -0.16;
              leftArmPivot.add(leftArm);
              root.add(leftArmPivot);

              const rightArmPivot = new THREE.Group();
              rightArmPivot.position.set(0.35, 0.78, 0);
              const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.42, 0.14), darkMetalMat);
              rightArm.position.y = -0.16;
              rightArmPivot.add(rightArm);
              root.add(rightArmPivot);

              scene.add(root);
              agentMeshes[agentId] = root;
              agentParts[agentId] = { head: headGroup, leftArm: leftArmPivot, rightArm: rightArmPivot, beacon };
              agentTargets[agentId] = new THREE.Vector3(0, 0, 0);
              agentStates[agentId] = 'idle';
            }
            return agentMeshes[agentId];
          };

          const updateLabels = () => {
            if (!canvasContainer.value) return;
            const width = canvasContainer.value.clientWidth;
            const height = canvasContainer.value.clientHeight;
            const labels = [];

            // Station Labels
            for (const [key, mesh] of Object.entries(stationMeshes)) {
              const pos = mesh.position.clone();
              pos.y += 1.9;
              pos.project(camera);
              if (pos.z < 1) {
                labels.push({
                  id: `st_${key}`,
                  text: stationMeta[key].name,
                  color: stationMeta[key].color,
                  x: (pos.x * 0.5 + 0.5) * width,
                  y: (-(pos.y * 0.5) + 0.5) * height
                });
              }
            }

            // Floating Progress Tags above Working Robots
            for (const [id, mesh] of Object.entries(agentMeshes)) {
              const ag = agents.value[id];
              if (!ag) continue;
              const pos = mesh.position.clone();
              pos.y += 1.85;
              pos.project(camera);
              if (pos.z < 1) {
                labels.push({
                  id: `ag_${id}`,
                  text: ag.state === 'working' ? `${ag.name} (${ag.progress}%)` : ag.name,
                  color: ag.color,
                  x: (pos.x * 0.5 + 0.5) * width,
                  y: (-(pos.y * 0.5) + 0.5) * height
                });
              }
            }
            screenLabels.value = labels;
          };

          const animate = () => {
            animationFrameId = requestAnimationFrame(animate);
            const now = Date.now();

            // Smoothly follow selected robot or return to studio center
            const desiredLookAt = new THREE.Vector3(0, 0.5, 0);
            if (focusedAgentId.value && agentMeshes[focusedAgentId.value]) {
              const botPos = agentMeshes[focusedAgentId.value].position;
              desiredLookAt.set(botPos.x, 0.8, botPos.z);
            }
            lookAtTarget.lerp(desiredLookAt, 0.08);

            const camHeight = cameraRadius * 0.68;
            camera.position.x = lookAtTarget.x + Math.sin(cameraAngle) * cameraRadius;
            camera.position.z = lookAtTarget.z + Math.cos(cameraAngle) * cameraRadius;
            camera.position.y = camHeight;
            camera.lookAt(lookAtTarget);

            for (const id in agentMeshes) {
              const robot = agentMeshes[id];
              const parts = agentParts[id];
              const target = agentTargets[id];
              const state = agentStates[id];

              const dx = target.x - robot.position.x;
              const dz = target.z - robot.position.z;
              const dist = Math.hypot(dx, dz);

              robot.position.x += dx * 0.05;
              robot.position.z += dz * 0.05;

              if (dist > 0.15) {
                robot.rotation.y = Math.atan2(dx, dz);
                robot.rotation.x = 0.12;
              } else {
                robot.rotation.x = 0;
              }

              if (state === 'working' && dist <= 0.6) {
                robot.position.y = Math.abs(Math.sin(now * 0.015)) * 0.08;
                parts.leftArm.rotation.x = -1.1 + Math.sin(now * 0.025) * 0.45;
                parts.rightArm.rotation.x = -1.1 + Math.cos(now * 0.025) * 0.45;
                parts.head.rotation.y = Math.sin(now * 0.01) * 0.25;
                parts.beacon.scale.setScalar(1 + Math.sin(now * 0.03) * 0.4);
              } else if (dist > 0.15) {
                robot.position.y = Math.abs(Math.sin(now * 0.012)) * 0.08;
                parts.leftArm.rotation.x = Math.sin(now * 0.015) * 0.5;
                parts.rightArm.rotation.x = -Math.sin(now * 0.015) * 0.5;
                parts.head.rotation.y = 0;
                parts.beacon.scale.setScalar(1);
              } else {
                robot.position.y = Math.sin(now * 0.004) * 0.04;
                parts.leftArm.rotation.x = Math.sin(now * 0.004) * 0.08;
                parts.rightArm.rotation.x = -Math.sin(now * 0.004) * 0.08;
                parts.head.rotation.y = Math.sin(now * 0.002) * 0.15;
                parts.beacon.scale.setScalar(1);
              }
            }

            updateLabels();
            renderer.render(scene, camera);
          };

          let ws;
          const connectWebSocket = () => {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => { connected.value = true; };

            ws.onmessage = (event) => {
              let data;
              try { data = JSON.parse(event.data); } catch { return; }

              if (data.type === 'INITIAL_STATE') {
                for (const [key, station] of Object.entries(data.stations)) {
                  if (!stationMeshes[key]) createStation(key, station);
                }
                agents.value = data.agents;
                for (const ag of Object.values(data.agents)) {
                  getOrCreateAgent(ag);
                }
                return;
              }

              if (data.agent) {
                const ag = data.agent;
                agents.value[ag.id] = { ...ag };
                getOrCreateAgent(ag);
                agentStates[ag.id] = ag.state;

                if (data.target) {
                  agentTargets[ag.id].set(data.target.x, 0, data.target.z + 1.1);
                }

                logs.value.unshift({
                  id: data.event_id,
                  name: ag.name,
                  color: ag.color || '#38bdf8',
                  message: data.message,
                  time: new Date().toLocaleTimeString().split(' ')[0]
                });
                if (logs.value.length > 30) logs.value.pop();
              }
            };

            ws.onclose = () => {
              connected.value = false;
              setTimeout(connectWebSocket, 3000);
            };
          };

          onMounted(() => {
            initScene();
            animate();
            connectWebSocket();
            window.addEventListener('resize', handleResize);
          });

          onUnmounted(() => {
            cancelAnimationFrame(animationFrameId);
            window.removeEventListener('resize', handleResize);
            if (ws) ws.close();
          });

          return {
            canvasContainer, connected, logs, agents, screenLabels,
            activeTab, focusedAgentId, adjustZoom, toggleFocusAgent,
